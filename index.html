<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainha das Lupas</title>

<style>
:root{
    --gold:#d4af37;
    --dark:#050505;
    --green:#25d366;
}

body{
    margin:0;
    font-family:Arial;
    background:var(--dark);
    color:#fff;
}

header{
    text-align:center;
    padding:40px;
}

h1{
    color:var(--gold);
    letter-spacing:3px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#111;
    border-radius:15px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:260px;
    object-fit:cover;
    border-radius:10px;
}

.nome{
    margin-top:10px;
    font-weight:bold;
}

.preco{
    color:var(--gold);
}

/* modal */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
}

.modal-content{
    background:#111;
    max-width:400px;
    margin:80px auto;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.btn{
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    cursor:pointer;
    width:100%;
}

.btn-zap{
    background:var(--green);
    color:#fff;
}

.btn-pix{
    background:var(--gold);
}

.qr{
    margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>Rainha das Lupas</h1>
<p>Catálogo Premium</p>
</header>

<div class="grid">

<div class="card" onclick="abrir('Oakley Juliet','46,00')">
<img src="juliet.jpg">
<div class="nome">Oakley Juliet</div>
<div class="preco">R$46</div>
</div>

<div class="card" onclick="abrir('Oakley Radar EV','70,00')">
<img src="Radar_EV1.jpg">
<div class="nome">Oakley Radar EV</div>
<div class="preco">R$70</div>
</div>

<div class="card" onclick="abrir('Oakley Flak','55,00')">
<img src="flak.jpg">
<div class="nome">Oakley Flak</div>
<div class="preco">R$55</div>
</div>

<div class="card" onclick="abrir('Oakley Pivete','40,00')">
<img src="pivete_capa.jpg">
<div class="nome">Oakley Pivete</div>
<div class="preco">R$40</div>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-content">

<h2 id="produto"></h2>

<button class="btn btn-pix" onclick="mostrarPix()">PAGAR PIX</button>

<img id="qr" class="qr">

<a id="zap" target="_blank" class="btn btn-zap">
FINALIZAR NO WHATSAPP
</a>

</div>
</div>

<script>

const zap="5592985573144";
const pix="03922067220";

function abrir(nome,preco){

document.getElementById("modal").style.display="block";

document.getElementById("produto").innerText=nome+" - R$"+preco;

let msg=encodeURIComponent("Olá, quero comprar "+nome+" por R$"+preco);

document.getElementById("zap").href=
"https://wa.me/"+zap+"?text="+msg;

document.getElementById("qr").src="";
}

function mostrarPix(){
document.getElementById("qr").src=
"https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+pix;
}

window.onclick=e=>{
if(e.target.id=="modal"){
modal.style.display="none";
}
}

</script>

</body>
</html>
