<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainha das Lupas</title>

<style>
:root {
    --gold:#d4af37;
    --dark:#050505;
}

body{
    margin:0;
    font-family:Arial;
    background:#050505;
    color:#fff;
}

header{
    text-align:center;
    padding:40px;
}

h1{
    color:var(--gold);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#111;
    padding:15px;
    border-radius:15px;
    text-align:center;
    cursor:pointer;
}

.img-box{
    height:250px;
}

.img-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:10px;
}

.nome{
    font-weight:bold;
    margin-top:10px;
}

.preco{
    color:var(--gold);
}

/* modal */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
}

.modal-content{
    background:#111;
    max-width:600px;
    margin:50px auto;
    padding:20px;
    border-radius:20px;
    text-align:center;
}

.gallery img{
    width:100%;
    margin:5px 0;
}

.btn{
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.btn-pix{
    background:gold;
}

.btn-zap{
    background:#25d366;
    color:white;
}

</style>
</head>

<body>

<header>
<h1>Rainha das Lupas</h1>
</header>

<div class="grid">

<div class="card" onclick="abrir('juliet','Oakley Juliet','46,00')">
<img src="juliet.jpg">
<div class="nome">Oakley Juliet</div>
<div class="preco">R$46</div>
</div>

<div class="card" onclick="abrir('Radar_EV','Oakley Radar EV','70,00')">
<img src="Radar_EV1.jpg">
<div class="nome">Oakley Radar EV</div>
<div class="preco">R$70</div>
</div>

<div class="card" onclick="abrir('flak','Oakley Flak','55,00')">
<img src="flak.jpg">
<div class="nome">Oakley Flak</div>
<div class="preco">R$55</div>
</div>

</div>

<div id="modal" class="modal">
<div class="modal-content">

<h2 id="nome"></h2>

<div id="galeria" class="gallery"></div>

<button class="btn btn-pix" onclick="pix()">PAGAR PIX</button>
<img id="qr">

<a id="zap" class="btn btn-zap" target="_blank">WHATSAPP</a>

</div>
</div>

<script>

const pixKey="03922067220";
const zap="5592985573144";

const db={
    juliet:["juliet1.jpg","juliet2.jpg","juliet3.jpg"],
    Radar_EV:["Radar_EV1.jpg","Radar_EV2.jpg","Radar_EV3.jpg"],
    flak:["flak1.jpg","flak2.jpg","flak3.jpg"]
};

function abrir(id,nome,preco){

    document.getElementById("modal").style.display="block";
    document.getElementById("nome").innerText=nome;

    let galeria=document.getElementById("galeria");
    galeria.innerHTML="";

    db[id].forEach(img=>{
        let i=document.createElement("img");
        i.src=img;
        galeria.appendChild(i);
    });

    let msg=encodeURIComponent("Quero "+nome+" R$"+preco);

    document.getElementById("zap").href=
    "https://wa.me/"+zap+"?text="+msg;

    document.getElementById("qr").src=
    "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+pixKey;
}

function pix(){
    alert("Use o QR Code");
}

window.onclick=e=>{
    if(e.target.id=="modal"){
        modal.style.display="none";
    }
}

</script>

</body>
</html>
